[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ai-harness-compiler"
version = "0.1.0"
description = "Compile project intent into typed, verifiable, project-specific AI engineering harnesses."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["pydantic>=2.10,<3", "PyYAML>=6.0.2,<7"]

[project.optional-dependencies]
team = [
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "scikit-learn>=1.7,<2",
  "httpx>=0.28,<1",
]

[project.urls]
Repository = "https://github.com/leozitogs/ai-harness-compiler"
Issues = "https://github.com/leozitogs/ai-harness-compiler/issues"

[project.scripts]
factory = "ai_harness_compiler.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "mypy>=1.15,<3", "types-PyYAML>=6.0.12", "jsonschema>=4.23,<5"]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_harness_compiler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true
