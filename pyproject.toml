[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ai-harness-compiler"
version = "0.1.0"
description = "Compile project intent into typed, verifiable, project-specific AI engineering harnesses."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "PyYAML>=6.0.2,<7"]

[project.scripts]
factory = "ai_harness_compiler.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-PyYAML>=6.0.12", "jsonschema>=4.23,<5"]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_harness_compiler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

