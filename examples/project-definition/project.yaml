schema_version: ProjectInput/v1
id: learning-studio
name: Learning Studio
conception: >-
  Uma plataforma para educadores organizarem materiais e prepararem aulas
  baseadas em fontes, com revisão humana antes da publicação.
domain: education
branding:
  audience: [educadores, coordenadores pedagógicos]
  tone: [claro, acolhedor, preciso]
  principles: [fontes verificáveis, controle do educador]
  visual_constraints: [interface acessível]
backlog:
  - id: material-library
    title: Biblioteca de materiais
    description: Permitir que o educador catalogue materiais e suas fontes.
    acceptance_criteria:
      - Cada material tem título, autor e referência de origem.
      - Materiais só são visíveis ao educador responsável.
    inputs: [material, metadados de origem]
    outputs: [material catalogado]
    data_owner: educador
    side_effects: [gravação na biblioteca]
    risk: medium
    implementation: deterministic
  - id: lesson-draft
    title: Rascunho de aula baseado em fontes
    description: Preparar um rascunho de aula usando os materiais selecionados.
    acceptance_criteria:
      - As afirmações do rascunho referenciam os materiais utilizados.
      - A publicação exige revisão e aprovação do educador.
    depends_on: [material-library]
    inputs: [materiais selecionados, objetivos de aprendizagem]
    outputs: [rascunho com referências]
    data_owner: educador
    risk: medium
    implementation: rag
constraints:
  technical: [Python 3.12 ou superior, contratos versionados]
  security: [não expor dados pessoais em traces]
  business: [revisão humana antes de publicação]
  max_build_cost_usd: 0
assets:
  - path: assets/brand-notes.md
    description: Referência visual e verbal; conteúdo não ingerido no MVP.
