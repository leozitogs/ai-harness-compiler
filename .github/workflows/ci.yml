name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.3"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest
      - run: uv run python scripts/export_schemas.py --check
      - run: uv run python scripts/generate_repo_agents.py --check
      - run: uv run python scripts/generate_sprint_plan.py --check
      - run: uv run python scripts/generate_sprint_plan.py --sprint sprint-2 --check
      - run: uv run python scripts/generate_sprint_plan.py --sprint sprint-2-5 --check
      - run: uv run python scripts/generate_sprint_plan.py --sprint sprint-2-5-5 --check
      - run: uv run python scripts/generate_sprint_plan.py --sprint sprint-2-6 --check
      - run: uv run factory memory check
      - run: uv run factory memory index --check
      - run: uv run factory build examples/project-definition --output output/smoke
      - run: uv run python output/smoke/.ai/hooks/verify_artifacts.py
      - run: uv build
