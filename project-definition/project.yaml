schema_version: ProjectInput/v1
id: ai-harness-compiler
name: AI Harness Compiler
conception: >-
  Compilar a intenção de novos projetos em harnesses de engenharia de IA específicos,
  tipados, rastreáveis, verificáveis e evolutivos. O produto inclui arquitetura,
  contexto, políticas, skills, prompts, ferramentas e planos de avaliação; agentes
  entram somente quando sua complexidade é justificada por evidências. Para cada
  projeto alvo, compilar também documentação permanente, memória de engenharia,
  captura de incidentes e lições verificadas, além de especialistas de domínio
  com ferramentas, competências, contexto e avaliações próprios.
  O compilador é generalista: estuda proposta, branding e regras de negócio por
  projeto, com packs opcionais extensíveis e sem nichos fixos no core.
domain: developer-tools
branding:
  audience: [AI engineers, tech leads, equipes de produto]
  tone: [técnico, claro, verificável]
  principles: [evidência antes de autonomia, contratos antes de geração, core independente]
  visual_constraints: [priorizar CLI e documentação acessível na primeira fase]
constraints:
  technical: [Python 3.12+, core puro sem SDKs de agentes, IR versionada, Linux e Windows]
  security: [inputs não confiáveis, aprovação para efeitos externos, isolamento entre projetos]
  business: [Apache-2.0, baseline offline, custo de serviços explicitamente autorizado]
  max_build_cost_usd: 0
backlog:
  - id: ahc-001
    title: Intake canônico e limites de entrada
    description: Como AI engineer, quero carregar definições confiáveis e diagnosticar entradas inválidas antes de planejar o harness.
    acceptance_criteria:
      - Chaves YAML duplicadas, manifesto acima do limite configurado e versões desconhecidas falham com diagnóstico estável.
      - UTF-8 e referências locais válidas são aceitas sem executar conteúdo ou acessar a rede.
      - Os casos válidos e inválidos são verificados em Linux e Windows.
    inputs: [project.yaml]
    outputs: [ProjectInput validado, diagnósticos]
    data_owner: proprietário do projeto
    risk: medium
    implementation: deterministic
  - id: ahc-002
    title: Perfil multidimensional de domínio
    description: Como arquiteto, quero distinguir domínio declarado, hipóteses e incógnitas para evitar decisões baseadas em certeza inventada.
    acceptance_criteria:
      - O contrato representa domínio, arquétipo, dados, risco e origem da classificação.
      - Declaração, hipótese e DOMAIN_UNCERTAIN possuem invariantes testadas e não fabricam confiança numérica.
      - A mudança de contrato tem política de compatibilidade e exemplo de migração documentados.
    depends_on: [ahc-001]
    risk: medium
    implementation: deterministic
  - id: ahc-003
    title: Evidence Pack com proveniência
    description: Como revisor, quero rastrear decisões a fontes e conhecer suas limitações de confiança e atualidade.
    acceptance_criteria:
      - Fontes possuem ID, origem, digest opcional, estado de verificação e instante de coleta quando aplicável.
      - Referências ausentes, duplicadas ou incompatíveis com a decisão são rejeitadas.
      - Declaração de usuário e pesquisa externa são distinguíveis sem disparar pesquisa automática.
    depends_on: [ahc-001]
    risk: medium
    implementation: deterministic
  - id: ahc-004
    title: Confiabilidade e benchmark offline do compilador
    description: Como mantenedor, quero demonstrar reprodutibilidade e medir o compilador com fixtures de diferentes domínios.
    acceptance_criteria:
      - Educação, comércio e ferramentas de desenvolvimento possuem fixtures com critérios rastreáveis.
      - Falhas de escrita produzem diagnóstico e não alteram um projeto existente.
      - Um benchmark offline registra duração, tamanho e versão sem declarar SLO sem medição.
    depends_on: [ahc-001]
    risk: medium
    implementation: deterministic
  - id: ahc-005
    title: PromptSpec e SkillSpec compiláveis
    description: Como AI engineer, quero procedimentos e prompts tipados, com ativação, contexto e verificadores explícitos.
    acceptance_criteria:
      - Contratos incluem entradas, saídas, versão, restrições, ferramentas e avaliação.
      - Projetos contrastantes e projetos do mesmo domínio com regras diferentes geram procedimentos ligados aos requisitos, sem ramificações fixas de nicho no core.
      - Referências inválidas falham antes da emissão e skills suportam carregamento progressivo.
    depends_on: [ahc-002, ahc-003, ahc-019, ahc-020]
    risk: medium
    implementation: deterministic
  - id: ahc-006
    title: Context Engine com orçamento e proveniência
    description: Como runtime, quero selecionar contexto relevante dentro de um orçamento e informar exclusões e conflitos.
    acceptance_criteria:
      - Seleção respeita orçamento e registra fontes selecionadas, omitidas e conflitantes.
      - Dados de projetos diferentes não compartilham contexto implicitamente.
      - Fixtures medem relevância e comportamento com fontes desatualizadas.
    depends_on: [ahc-003, ahc-005]
    risk: high
    implementation: undecided
  - id: ahc-007
    title: Tools e Policy Engine independente
    description: Como operador, quero validar permissões, budgets e aprovações antes de efeitos colaterais.
    acceptance_criteria:
      - ToolSpec define escopo, I/O, efeitos, idempotência e limites de execução.
      - Escritas externas sem aprovação falham antes da chamada e geram evento auditável.
      - Negação por política é testada sem depender de decisão de modelo.
    depends_on: [ahc-005]
    risk: high
    implementation: deterministic
  - id: ahc-008
    title: Eval runner e Simulation Lab
    description: Como revisor, quero executar tarefas isoladas e avaliar resultado, trajetória e regressões.
    acceptance_criteria:
      - Evals distinguem not-run, pass, fail e error com evidências persistidas.
      - Sandbox e timeout limitam execução; falhas não são interpretadas como aprovação.
      - Gates verificam saída e uso de ferramentas com datasets de teste reservados.
    depends_on: [ahc-004, ahc-005]
    risk: high
    implementation: deterministic
  - id: ahc-009
    title: Adapter de LLM e pesquisa controlada
    description: Como projetista, quero usar provedores substituíveis para hipóteses e pesquisa com limites e proveniência.
    acceptance_criteria:
      - Adapter possui fake offline e contrato testado de timeout, retry e orçamento.
      - Saídas do modelo são validadas por schema e política antes de qualquer ação.
      - Pesquisa preserva citações e separa fontes verificadas de declarações não verificadas.
    depends_on: [ahc-003, ahc-007]
    risk: high
    implementation: llm
  - id: ahc-010
    title: Execução durável e observabilidade
    description: Como operador, quero retomar jobs e aprovações após falhas sem duplicar efeitos.
    acceptance_criteria:
      - Workflow retoma após interrupção com idempotência e limites de tentativas.
      - Spans e métricas correlacionam projeto, build, versão e etapa sem segredos.
      - Cancelamento e expiração de aprovação são exercitados em testes de integração.
    depends_on: [ahc-008, ahc-009]
    risk: high
    implementation: deterministic
  - id: ahc-011
    title: Busca e comparação de arquiteturas
    description: Como arquiteto, quero comparar candidatos sob qualidade, custo, latência e complexidade.
    acceptance_criteria:
      - Candidatos executam o mesmo benchmark e incluem baseline sem agentes.
      - Busca possui orçamento e condição de parada aplicados pelo control plane.
      - Ranking registra evidências e trade-offs e não usa o conjunto de teste para otimização.
    depends_on: [ahc-006, ahc-010]
    risk: high
    implementation: undecided
  - id: ahc-012
    title: Instalação revisável e rollback
    description: Como mantenedor de um projeto, quero adotar um harness após revisar diff e restaurar a versão anterior.
    acceptance_criteria:
      - Dry-run informa arquivos novos, alterados e conflitos sem escrever no alvo.
      - Instalação exige gates de avaliação e aprovação e detecta alterações concorrentes.
      - Falha parcial tem recuperação testada e rollback preserva conteúdo do usuário.
    depends_on: [ahc-004, ahc-008]
    risk: high
    implementation: deterministic
  - id: ahc-013
    title: Evolução e Experience Store
    description: Como equipe, quero propor melhorias a partir de falhas sem permitir autoalteração irrestrita.
    acceptance_criteria:
      - Proposta liga falha, evidência, versão anterior e mudança candidata.
      - Regressão e aprovação bloqueiam promoção insegura.
      - Experiências e skills reutilizadas têm versão, proveniência e isolamento entre projetos.
    depends_on: [ahc-010, ahc-011, ahc-012, ahc-018]
    risk: high
    implementation: undecided
  - id: ahc-014
    title: API e operação multi-projeto
    description: Como organização, quero processar múltiplos projetos com limites, isolamento e acompanhamento de jobs.
    acceptance_criteria:
      - API autentica chamadas, aplica autorização por projeto e idempotência por solicitação.
      - Jobs possuem quotas, backpressure, paginação e consulta de estado.
      - Teste de carga mede throughput e latência e teste de isolamento impede acesso cruzado.
    depends_on: [ahc-010, ahc-012]
    risk: high
    implementation: deterministic
  - id: ahc-015
    title: DocumentationLearningSpec por projeto
    description: Como PO de um projeto alvo, quero especificar sua documentação e memória de aprendizado conforme domínio, requisitos e restrições.
    acceptance_criteria:
      - A IR versionada define taxonomia DE/DOC/ADR/INC/LES/RUN/EXP, ownership, revisão, retenção, proveniência e escopo do projeto.
      - Contexto e política de aprendizado derivam de ProjectDNA e Evidence Pack, com incógnitas explícitas e rastreabilidade de cada regra.
      - Projetos com regras distintas, incluindo domínio não pré-cadastrado, demonstram configurações diferentes sem copiar memória privada entre projetos.
    depends_on: [ahc-003, ahc-005]
    inputs: [ProjectDNA, Evidence Pack, requisitos de documentação e aprendizado]
    outputs: [DocumentationLearningSpec validada]
    data_owner: proprietário do projeto alvo
    risk: high
    implementation: deterministic
  - id: ahc-016
    title: Compilador de documentação e memória específicas
    description: Como equipe de um projeto alvo, quero receber um sistema funcional de registros, busca e aprendizado integrado ao harness gerado.
    acceptance_criteria:
      - O build gera contratos, registros iniciais rastreáveis, templates de domínio, índice, CLI/adapters, políticas e instruções para colaboradores e agentes.
      - A biblioteca gerada preserva revisões, isolamento, validade das evidências e conflitos de atualização; exemplos fictícios não são promovidos a soluções verificadas.
      - Dois projetos recebem bundles distintos e reprodutíveis, com testes da memória e atribuições de componentes incorporados.
    depends_on: [ahc-004, ahc-015]
    inputs: [DocumentationLearningSpec, HarnessSpec]
    outputs: [sistema de documentação e memória compilado para o projeto]
    data_owner: proprietário do projeto alvo
    risk: high
    implementation: deterministic
  - id: ahc-017
    title: Agent Factory com especialização de domínio
    description: Como PO de um projeto alvo, quero especialistas aprofundados que conheçam o domínio, usem ferramentas adequadas e respondam a critérios mensuráveis.
    acceptance_criteria:
      - AgentSpec representa persona, competências, objetivo, fronteiras, I/O, skills, tools/MCP, memória, modelo, orçamento, parada, delegação e responsável humano.
      - O runtime compilado executa ferramentas específicas em tarefas do domínio e consulta a memória vigente; prompts genéricos com nomes novos não satisfazem a especialização.
      - Fixtures comparam especialistas a uma baseline nas mesmas tarefas e medem resultado, trajetória, uso de ferramentas, custo e latência com datasets reservados.
      - O projeto pode receber zero agentes quando código ou workflows atendem aos critérios; adaptações LangGraph/LLM/ML ficam atrás de contratos próprios.
    depends_on: [ahc-005, ahc-007, ahc-009, ahc-015]
    inputs: [ProjectDNA, CapabilityGraph, Evidence Pack, DocumentationLearningSpec]
    outputs: [AgentSpec e runtime de especialistas específicos do projeto]
    data_owner: proprietário do projeto alvo
    risk: high
    implementation: undecided
  - id: ahc-018
    title: Pipeline de aprendizagem por experiências do projeto
    description: Como equipe de um projeto alvo, quero registrar desafios e reutilizar soluções verificadas entre sessões de chat e execuções de agentes.
    acceptance_criteria:
      - Falha relevante pode produzir INC draft com reprodução e origem; diagnóstico, tentativas e solução permanecem separados de hipóteses não verificadas.
      - Regressão, evidência, aplicabilidade, limitações e revisão são exigidas para promover LES e recuperar a solução em tarefas futuras.
      - Colaboradores via chat e agentes locais/providers compartilham o protocolo, com orçamento de contexto, detecção de evidência alterada e trilha de revisão.
      - Transferência de experiências entre projetos exige autorização, anonimização, compatibilidade e revisão; treinamento de modelos ocorre apenas em EXP separado e avaliado.
    depends_on: [ahc-008, ahc-010, ahc-016, ahc-017]
    inputs: [traces, falhas, desafios, correções propostas, evidências de regressão]
    outputs: [incidentes, lições verificadas, procedimentos e propostas de evolução]
    data_owner: proprietário do projeto alvo
    risk: high
    implementation: undecided
  - id: ahc-019
    title: Entendimento generalista da proposta e regras de negócio
    description: Como PO, quero que o compilador estude proposta, branding, backlog e restrições para propor entendimento do projeto sem exigir um nicho pré-programado.
    acceptance_criteria:
      - ProjectUnderstandingSpec preserva input original, fontes, declarações, hipóteses de domínio, público, objetivos, entidades, regras de negócio, conflitos e perguntas pendentes com referências válidas.
      - Um adapter de modelo substituível produz propostas estruturadas; fake é restrito a testes, respostas reais são validadas e uma execução controlada com modelo real é demonstrada sem promover hipóteses ou scores inventados a fatos.
      - Avaliação reservada cobre domínio não cadastrado, mesmo domínio com regras diferentes, branding em conflito com backlog e proposta ambígua; nenhum enum ou switch de nichos é necessário para processar input novo.
    depends_on: [ahc-002, ahc-003]
    inputs: [proposta, branding, backlog, restrições, fontes locais autorizadas]
    outputs: [ProjectUnderstandingSpec proposta, regras de negócio rastreáveis, perguntas pendentes]
    data_owner: proprietário do projeto alvo
    risk: high
    implementation: llm
  - id: ahc-020
    title: Plano de harness generalista e packs opcionais
    description: Como AI engineer, quero derivar o plano do harness do entendimento e selecionar frameworks/templates extensíveis quando aplicáveis, sem depender de uma lista fixa de nichos.
    acceptance_criteria:
      - HarnessBlueprintSpec mapeia regras e capacidades a necessidades de contexto, skills, ferramentas, workflows, documentação e evals, e alimenta a compilação da baseline atual após revisão; módulos ainda não implementados permanecem gaps explícitos.
      - PatternPackSpec versionado define aplicabilidade, evidências, parâmetros, exclusões, conflitos e compatibilidade; o projeto funciona sem pack e novos packs são registrados sem editar o core, com regras específicas do projeto prevalecendo.
      - O mesmo domínio com regras diferentes gera planos diferentes; domínio novo sem pack tem baseline válida ou perguntas pendentes, e seleção incompatível, revisão inválida ou regras sem origem são rejeitadas antes de exportar a proposta.
    depends_on: [ahc-019]
    inputs: [ProjectUnderstandingSpec, CapabilityGraph, Evidence Pack, catálogo opcional de packs]
    outputs: [HarnessBlueprintSpec revisável, decisões de seleção de packs e gaps]
    data_owner: proprietário do projeto alvo
    risk: high
    implementation: undecided
  - id: ahc-021
    title: Rubrica e evals semânticos do entendimento
    description: Como PO, quero medir cobertura de regras, suporte das citações e qualidade de conflitos para impedir que JSON válido seja confundido com entendimento correto.
    acceptance_criteria:
      - Dataset versionado separa desenvolvimento e holdout com inputs e expectativas congelados antes da otimização; inclui domínio novo, regras divergentes na mesma categoria, ambiguidade, contradição real, regras compatíveis, asset não lido e conteúdo adversarial.
      - Runner específico de entendimento registra not-run, pass, fail e error, modelo/digest, input/prompt/rubrica, tentativas e evidências; revisão semântica pendente ou campos ausentes nunca são interpretados como aprovação.
      - Verificadores e revisão humana avaliam cobertura de regras, suporte de cada citação, conflitos falsos e dados não lidos; o modelo candidato não aprova sua própria saída, e chamadas reais permanecem fora dos testes padrão.
    depends_on: [ahc-002, ahc-003, ahc-004]
    inputs: [ProjectUnderstandingSpec, corpus de desenvolvimento, holdout, rubrica]
    outputs: [relatórios semânticos rastreáveis, falhas de cobertura e suporte]
    data_owner: proprietário do projeto e PO
    risk: high
    implementation: deterministic
  - id: ahc-022
    title: Pipeline de entendimento com grounding e cobertura
    description: Como AI engineer, quero que o estudo extraia regras completas e conclusões sustentadas pelas fontes, preservando incógnitas e bloqueando inventar conteúdo de assets.
    acceptance_criteria:
      - Extração tipada e análise separam declarações, hipóteses, regras, perguntas e conflitos; não inferem que revisão humana exige revisor externo nem afirmam conteúdo de asset não ingerido.
      - Prompts e estratégia de decomposição são versionados e ajustados somente no conjunto de desenvolvimento; validação de suporte, cobertura e revisão impede promoção silenciosa de hipóteses.
      - Baseline e candidato são comparados com a rubrica congelada; regressões do INC-0007 são reproduzidas, tentativas limitadas são registradas e falhas permanecem explícitas sem reparo ilimitado ou aprovação automática.
    depends_on: [ahc-021]
    inputs: [UnderstandingRequest, fontes autorizadas, rubrica e findings]
    outputs: [propostas fundamentadas, prompts versionados, regressões semânticas]
    data_owner: proprietário do projeto alvo
    risk: high
    implementation: llm
  - id: ahc-023
    title: Qualificação do modelo e perfil de execução local
    description: Como operador, quero escolher modelo e perfil pelo equilíbrio entre qualidade, latência e memória no hardware disponível, com alimentação e ambiente registrados.
    acceptance_criteria:
      - Comparação registra modelo/digest, quantização, contexto, prompt, parâmetros, energia, ambiente, uso de GPU/RAM e tempos de carga e geração; cold e warm são separados e o plano prevê repetições e limites de execução.
      - Modelo é selecionado pela rubrica semântica antes de latência; holdout não é usado para tuning, e falha crítica, julgamento pendente, truncamento ou omissão de regras obrigatórias bloqueiam qualificação.
      - Perfil recomendado possui comandos reproduzíveis, orçamento e fallback explícitos; nenhum vencedor é obrigatório quando todos falham, e nova configuração não altera energia do sistema nem habilita cloud ou concorrência sem autorização.
    depends_on: [ahc-022]
    inputs: [candidatos locais, rubrica, holdout, telemetria e resultados]
    outputs: [relatório de qualificação, perfil recomendado ou rejeição justificada]
    data_owner: proprietário do ambiente
    risk: high
    implementation: deterministic
  - id: ahc-024
    title: Perfis de inferência versionados por provider
    description: Como operador, quero configurar parâmetros compatíveis e rastrear o perfil completo sem reinterpretar execuções históricas.
    acceptance_criteria:
      - Contrato versionado registra modelo, provider, parâmetros solicitados, observados ou desconhecidos e fingerprint completo; versões anteriores mantêm semântica e hashes.
      - Adapter rejeita opções incompatíveis, limita contexto, saída, timeout e orçamento; configuração pessoal não altera silenciosamente experimentos.
      - Testes offline cobrem validação, fingerprint alterado por parâmetro e preservação de ferramentas e gates; chamadas reais ficam fora da suíte padrão.
    depends_on: [ahc-021, ahc-022]
    risk: high
    implementation: deterministic
  - id: ahc-025
    title: Experimentos controlados de otimização de inferência
    description: Como PO, quero comparar parâmetros e contexto com métricas semânticas antes de decidir por treinamento.
    acceptance_criteria:
      - Baseline e candidatos executam desenvolvimento revisado com repetições e orçamentos; parâmetros, ambiente e todas as tentativas ficam registrados.
      - Comparação separa cobertura e suporte semântico de validade estrutural, mede estabilidade, truncamento, recursos e tempos cold e warm sem inferir causalidade de variáveis não controladas.
      - Candidato é congelado antes da avaliação separada; resultado pode rejeitar todos os perfis e nunca usa holdout para tuning ou autoaprovação do candidato.
    depends_on: [ahc-024]
    risk: high
    implementation: llm
  - id: ahc-026
    title: Viabilidade e piloto condicionado de fine-tuning
    description: Como AI engineer, quero decidir por evidência se LoRA ou QLoRA melhora um comportamento generalista e cabe no ambiente autorizado.
    acceptance_criteria:
      - Decisão go ou no-go identifica erro aprendível, baseline sem treino, orçamento, licenças e viabilidade medida; piloto só executa após satisfazer gates de dados e recursos.
      - Dataset revisado preserva origem e consentimento, separa projetos e famílias e exclui holdout, autoaprovações, credenciais e raciocínio privado; regras específicas permanecem no input do projeto.
      - Se houver piloto, modelo base e adapter são comparados após exportação e quantização sob avaliação separada com regressões de generalização; sem ganho demonstrado não há promoção.
    depends_on: [ahc-025]
    risk: high
    implementation: undecided
  - id: ahc-027
    title: Nexo observador com estado e evidências de Scrum
    description: Como PO, quero um retrato verificável de backlog, sprints, PRs, CI e impedimentos para detectar divergências sem inventar entregas.
    acceptance_criteria:
      - Contratos versionados de snapshot, evidência e impedimento preservam origem, instante de observação, hashes ou revisões e estado desconhecido; regras de gestão ficam independentes de LangGraph e do provider.
      - Coletores somente leitura reconciliam planejamento local e GitHub com precedência explícita por campo; dado indisponível, stale ou divergente nunca é convertido em conclusão ou aceite.
      - Regressões incluem PR integrado com critério pendente, dependência aberta, CI sem julgamento semântico e fechamento parcial da Sprint 2.5; nenhum teste padrão chama serviço externo.
    depends_on: [ahc-003, ahc-004]
    inputs: [backlog, planos, documentação, issues, PRs, CI, revisões]
    outputs: [SprintSnapshot, DeliveryEvidence, Impediment, diagnóstico rastreável]
    risk: high
    implementation: deterministic
  - id: ahc-028
    title: Nexo planejador e facilitador Scrum
    description: Como PO, quero propostas de refinamento, planning, acompanhamento e review fundamentadas no estado observado e nas decisões humanas.
    acceptance_criteria:
      - Propostas tipadas vinculam Sprint Goal, histórias, dependências, critérios e evidências; capacidade ausente gera incógnita, sem velocity, prazo ou estimativa inventados.
      - Nexo usa ferramentas permitidas, contexto incremental e memória revisada; regra determinística cobre status e DoD, LLM opcional interpreta ambiguidades sob budgets, sem converter relatório em início ou conclusão de sprint.
      - Demo offline prepara diagnóstico e review da Sprint 2.5 com carryover explícito; testes rejeitam injeção, fonte alterada, aceitação inexistente e confusão entre proposta, execução e aceite humano.
    depends_on: [ahc-027]
    inputs: [SprintSnapshot, política Scrum, objetivos, capacidade declarada, memória]
    outputs: [ScrumActionProposal, propostas de refinamento e cerimônias]
    risk: high
    implementation: llm
  - id: ahc-029
    title: Nexo operador com autorização e retomada segura
    description: Como PO, quero aplicar propostas autorizadas sem duplicar operações, sobrescrever alterações concorrentes ou dar autoridade irrestrita ao agente.
    acceptance_criteria:
      - Escritas limitadas a operações tipadas e autorizadas, com alvo, diff e revisão esperada; mudanças de escopo, ordem, status e marcos respeitam decisões humanas e a DoD, sem shell arbitrário.
      - Journal persistente e recibos registram proposta, autorização, tentativa e estado remoto observado; replay, timeout após escrita e concorrência não repetem efeitos silenciosamente, exigindo reconciliação quando o resultado é incerto.
      - Testes com adapter fake exercitam idempotência, autorização stale, revisão remota alterada, cancelamento e falha parcial; integração real depende de autorização por ação e não declara reunião, aceite ou tarefa executada sem evidência.
    depends_on: [ahc-028]
    inputs: [ScrumActionProposal revisada, autorização, snapshot do alvo]
    outputs: [ActionReceipt, journal e estado reconciliado]
    risk: high
    implementation: deterministic
  - id: ahc-030
    title: Vera revisora de QA aprofundado e apoio ao encerramento
    description: Como PO, quero um agente revisor funcional que investigue falhas técnicas e de regras de negócio e forneça ao Nexo evidências para a review e a decisão de encerramento da sprint.
    acceptance_criteria:
      - A Vera existente evolui com modo revisor executável no adapter team, contratos tipados de entrada, achados e parecer, contexto limitado, memória revisada, ferramentas permitidas e budgets; uma persona em Markdown ou matriz sem execução não constitui entrega.
      - Cada achado identifica severidade P0 a P3, revisão e escopo inspecionados, regra ou critério afetado, evidência, reprodução quando verificável, impacto e recomendação; linhas, testes, benchmarks, falhas e sucessos nunca são inventados e cobertura ausente fica inconclusiva.
      - A revisão cobre código, contratos, referências, proveniência, regras de negócio, regressões, segurança e integridade dos artefatos; checks determinísticos e julgamento semântico permanecem separados, e uma chamada de LLM ou CI verde não estabelece correção de negócio.
      - O fluxo distingue autoria, revisão e aceite, revalida hashes e revisões antes de reutilizar pareceres, resiste a prompt injection e não permite autoaprovação; modelo opcional é consultivo, sem chamadas pagas ou de rede na suíte padrão e sem shell arbitrário ou escrita remota pelo revisor.
      - Nexo consome o parecer vinculado ao snapshot e commit corretos para preparar review, matriz de critérios, pendências, riscos e carryover; P0 e P1 abertos bloqueiam recomendação de entrega plena, critérios não verificados não viram Done e fechamento parcial permanece explícito para decisão humana.
      - Testes e demo exercitam falso sucesso, falha de negócio com CI verde, evidência stale ou ausente, reprodução inválida, achado resolvido em nova revisão e fechamento parcial; falhas reais alimentam INC e lições somente com evidência revisada, sem criar aprovação, cerimônia ou encerramento fictício.
    depends_on: [ahc-029]
    inputs: [SprintSnapshot, código e diff por revisão, critérios de aceitação, política de qualidade, evidências de checks, memória revisada]
    outputs: [QAReviewRequest/v1, QAReviewReport/v1, SprintClosureAssessment/v1, QAReviewComparison/v1, candidatos de incidente]
    risk: high
    implementation: llm
  - id: ahc-031
    title: Especificação funcional e exemplos antes do plano técnico
    description: Como PO, quero transformar intenção e regras confirmadas em uma mudança versionada com exemplos concretos
      antes de delegar implementação.
    depends_on:
    - ahc-019
    - ahc-021
    - ahc-022
    inputs:
    - ProjectDNA revisado
    - regras e perguntas confirmadas
    outputs:
    - ChangeSpec
    - BusinessExampleMap
    - FunctionalSpec
    risk: high
    implementation: deterministic
    acceptance_criteria:
    - Contratos versionados distinguem pedido, hipótese, regra confirmada, pergunta, decisão, especificação funcional
      e plano técnico; especificar não executa nem aprova a mudança.
    - Cada regra vincula fontes e exemplos sintéticos de sucesso, falha e fronteira quando aplicáveis; ausência ou
      inaplicabilidade é justificada e perguntas materiais conservam dono e impacto.
    - Uma mudança preserva identidade, revisões e critérios do intake ao archive; alteração semântica de escopo invalida
      o aceite dependente, enquanto progresso de task não reescreve a especificação aprovada.
    - Fixtures de domínio não pré-cadastrado, zero agentes, conflito real e normas compatíveis demonstram que o fluxo
      deriva do projeto e mantém julgamento humano separado de validação estrutural.
  - id: ahc-032
    title: Grafo de rastreabilidade e autoridade das fontes
    description: Como revisor, quero navegar de uma regra ou decisão aos requisitos, tarefas, artefatos e testes afetados,
      conservando escopo e vigência.
    depends_on:
    - ahc-003
    - ahc-015
    - ahc-031
    inputs:
    - Evidence Pack
    - decisões revisadas
    - ChangeSpec
    outputs:
    - TraceabilityGraph
    - SourceAuthorityPolicy
    - ImpactReport
    risk: high
    implementation: deterministic
    acceptance_criteria:
    - Nós e arestas tipados ligam projeto, regra, exemplo, decisão, requisito, task, artefato, teste e review com
      revisão, fonte e digest verificáveis; ciclos indevidos, referências ausentes e identidades duplicadas são rejeitados.
    - Autoridade, confiança, atualidade e similaridade são dimensões distintas; a política é configurável por projeto
      e campo, nunca transforma ranking de busca em precedência de negócio.
    - Rascunhos, fontes rejeitadas ou substituídas e citações stale geram diagnósticos por etapa; conflitos de fontes
      vigentes permanecem visíveis até decisão explícita, sem precedência inventada.
    - Análise de impacto percorre dependências e invalida apenas pareceres afetados; testes incluem substituição de
      decisão, fonte removida, conflito com duas origens e isolamento entre projetos.
  - id: ahc-033
    title: Pacotes de contexto por etapa com busca avaliada
    description: Como agente ou ferramenta, quero receber o contexto mínimo adequado à etapa e ao escopo, com explicação
      das inclusões e omissões.
    depends_on:
    - ahc-006
    - ahc-032
    inputs:
    - TraceabilityGraph
    - ContextSpec
    - escopo e etapa
    outputs:
    - ContextPacket
    - RetrievalEvaluationReport
    risk: high
    implementation: deterministic
    acceptance_criteria:
    - Receitas declarativas selecionam contexto por etapa, papel e escopo; cada trecho traz localização, digest, autoridade
      declarada e caminho que justificou sua inclusão.
    - Pacote aplica limites rígidos de bytes e tokens pelo tokenizer declarado; truncamento é explícito e bloqueios
      materiais nunca desaparecem para caber, gerando estado insuficiente quando o mínimo obrigatório excede o orçamento.
    - Busca lexical é baseline; grafo, embeddings e reranker são adapters opcionais comparados em consultas revisadas
      com índices temporais congelados, recall, MRR, custo e latência; indisponível ou não medido não vira zero ou
      sucesso.
    - Casos de injeção em documento, fonte substituída, Unicode, documento obrigatório grande, vocabulário novo e
      acesso cruzado exercitam falhas fechadas sem depender de serviço externo.
  - id: ahc-034
    title: Delegação de especialistas com privilégios atenuados
    description: Como operador, quero compor especialistas por capacidade e reutilizá-los sem ampliar permissões,
      orçamento ou acesso herdados.
    depends_on:
    - ahc-007
    - ahc-017
    - ahc-033
    inputs:
    - AgentSpec
    - pedido de especialização
    - política e orçamento do pai
    outputs:
    - SpecialistRequest
    - DelegationGrant
    - SpecialistRegistry
    risk: high
    implementation: deterministic
    acceptance_criteria:
    - Pedido descreve intenção, capacidades, modo, vida útil e contrato de saída; identidade reutilizável inclui versões
      de persona, pacotes e política, enquanto a execução conserva origem e snapshot próprios.
    - Permissões efetivas são a interseção do pai, task, projeto e política; ferramentas, leituras, escritas, comandos,
      profundidade e rede nunca aumentam na delegação, e papel revisor continua sem poder de aceite.
    - Orçamento agregado de filhos, incluindo falhas e trabalho concorrente, não excede o saldo reservado do pai;
      custos ou capacidades de provider desconhecidos não são tratados como gratuitos ou comparáveis.
    - Toda reutilização recalcula o grant para o contexto atual; testes de propriedades e casos adversariais cobrem
      caminhos absolutos, symlinks, opções de comando, revogação, escalada por skill e esgotamento concorrente.
  - id: ahc-035
    title: Execução de TaskGraph com isolamento e cotas globais
    description: Como mantenedor, quero executar tarefas independentes em ambientes isolados e integrar somente resultados
      verificados, com cancelamento e efeitos controlados.
    depends_on:
    - ahc-008
    - ahc-010
    - ahc-034
    inputs:
    - TaskGraph aprovado
    - DelegationGrant
    - política de execução
    outputs:
    - ExecutionPlan
    - WorkspaceLease
    - IntegrationReport
    risk: high
    implementation: deterministic
    acceptance_criteria:
    - Runner opcional fora do compilador transforma dependências e cercas em lotes, reserva workspaces e recursos,
      mantém limite global de tempo, tokens, custo e processos e oferece baseline sequencial.
    - Tasks com escrita sobreposta ou dependências de artefato não rodam em paralelo; fan-in verifica base, diff,
      escopo, conflitos e testes, preservando resultado parcial sem merge remoto automático.
    - Leases, locks, cancelamento e encerramento de árvores são exercitados em Windows e Linux; falha de limpeza ou
      resultado incerto impede alegar sucesso e não causa repetição cega de efeitos.
    - Retomada depende de política própria e revalidação de autorização e saldo; campanhas de uso único e orçamentos
      encerrados permanecem irretomáveis, mesmo com checkpoints disponíveis.
  - id: ahc-036
    title: Evidência de CI por revisão e seleção conservadora de checks
    description: Como revisor, quero reutilizar evidência válida do mesmo snapshot e acelerar o feedback local sem
      omitir os checks obrigatórios de integração.
    depends_on:
    - ahc-004
    - ahc-030
    - ahc-032
    inputs:
    - diff e snapshot Git
    - política de checks
    - QAReviewReport
    outputs:
    - CheckPlan
    - CheckReceipt
    - EvidenceManifest
    risk: high
    implementation: deterministic
    acceptance_criteria:
    - Receipt inclui HEAD, merge-base, estado dirty, configuração, lockfile, ambiente, comandos tipados e resultados
      com digest; cache só reutiliza escopo equivalente e exige mesma revisão e política.
    - Seleção por impacto explica checks executados e adiados; mudanças de fixtures, configuração, contratos, arquivos
      de dados, imports não resolvidos ou ferramenta de seleção exigem fallback conservador para suíte completa.
    - Integração mantém todos os checks obrigatórios e testes de negócio relevantes; skip, cache parcial, timeout,
      not-run e error nunca viram evidência de aceite ou cobertura completa.
    - Evidências compactas versionadas referenciam artifacts privados com digest e retenção; expiração, falta de acesso
      ou mudança de base invalidam reutilização, e o revisor não aceita receipt autoaprovada por modelo.
  - id: ahc-037
    title: Diagnóstico de ambiente e onboarding por papel
    description: Como integrante de um projeto alvo, quero saber quais dependências preciso e qual preparo falta antes
      de executar agentes ou ferramentas.
    depends_on:
    - ahc-004
    - ahc-024
    inputs:
    - perfil de projeto
    - manifesto de ferramentas
    - capacidades observadas do ambiente
    outputs:
    - EnvironmentReadinessReport
    - SetupPlan
    risk: medium
    implementation: deterministic
    acceptance_criteria:
    - Manifesto declara requisitos por papel, plataforma, versão e finalidade, separando obrigatório de opcional;
      o diagnóstico padrão é somente leitura e não instala, autentica, baixa modelo ou altera energia.
    - Relatório distingue ausente, incompatível, indisponível, desconhecido e pronto, registrando observação e limites
      de RAM, disco, GPU e bibliotecas nativas sem transformar falha de sonda em zero.
    - Plano revisável lista passos permitidos, efeitos, origem e verificação posterior; execução futura exige autorização
      própria e journal, sem shell derivado de texto externo ou instalação irrestrita.
    - Fakes offline cobrem PATH stale, Windows e Linux, versão incompatível, poucos recursos e usuário sem privilégio;
      perfil não ativa cloud ou concorrência ao detectar hardware melhor.
  - id: ahc-038
    title: Intake seguro de pacotes de branding e design
    description: Como PO, quero usar tokens, componentes e estados de interface como evidências explícitas do projeto,
      sem misturar apresentação com regras confirmadas de negócio.
    depends_on:
    - ahc-001
    - ahc-003
    - ahc-020
    - ahc-032
    inputs:
    - pacote de assets autorizado
    - fontes e contrato de design
    outputs:
    - AssetEvidencePack
    - DesignContract
    - ImportReport
    risk: high
    implementation: deterministic
    acceptance_criteria:
    - Adapter opt-in valida manifesto, hashes, limites de arquivo e pacote, referências, paths, colisões de nomes
      e conteúdo ativo; recusa traversal, symlinks, arquivos duplicados, ZIP bomb e referências de rede inesperadas
      antes de emitir artifacts.
    - Original privado e representação normalizada são separados; ingestão registra o que foi lido, omitido ou não
      suportado, com revisão de privacidade e direitos, sem alegar entendimento de imagem não processada.
    - Tokens, vocabulário, acessibilidade, componentes e estados se vinculam à especificação funcional; aparência
      não concede permissões, resolve conflito de negócio ou altera a precedência confirmada.
    - Projeto sem UI ignora esse adapter; fixtures sintéticas incluem estados vazios, loading, erro e sucesso quando
      aplicáveis, SVG ativo, fonte ausente e formato desconhecido, sem exigir ferramenta proprietária.
  - id: ahc-039
    title: Casos de avaliação derivados de incidentes e mudanças
    description: Como QA, quero converter falhas relevantes e correções verificadas em candidatos de regressão reproduzíveis,
      evitando contaminação e aprendizado não comprovado.
    depends_on:
    - ahc-008
    - ahc-018
    - ahc-036
    inputs:
    - INC e LES revisados
    - histórico de mudanças
    - evidências de teste
    outputs:
    - ExperienceCaseCandidate
    - RegressionCorpus
    - CaseReview
    risk: high
    implementation: deterministic
    acceptance_criteria:
    - Extração preserva reprodução, versão anterior, correção, teste e origem, mas propõe somente casos draft; mensagem
      de commit, CI verde ou resposta do autor não bastam para provar o oráculo.
    - Curador revisa consentimento, licença, anonimização, agrupamento por projeto e família e separação temporal;
      casos expostos são desenvolvimento ou regressão, nunca holdout cego recuperado.
    - Harness de avaliação usa snapshot anterior e oráculo oculto, bloqueia acesso ao patch de solução e ao histórico
      futuro e roda somente em sandbox autorizada fora do compilador.
    - Checks rejeitam vazamento de resposta, credenciais, teste não reproduzível, bug de setup confundido com falha
      do candidato e métricas que descartem tentativas ou casos indisponíveis.
  - id: ahc-040
    title: Aprendizado operacional em sombra com promoção controlada
    description: Como operador, quero medir recomendações de roteamento, risco e acoplamento antes de permitir que
      alterem decisões reais de execução.
    depends_on:
    - ahc-023
    - ahc-025
    - ahc-035
    - ahc-039
    inputs:
    - telemetria autorizada
    - RegressionCorpus
    - baseline determinística
    outputs:
    - ShadowRecommendation
    - RoutingExperiment
    - PromotionDecision
    risk: high
    implementation: undecided
    acceptance_criteria:
    - Baseline determinística continua decidindo em modo sombra; sugestão, ação efetiva, versão de política, restrições
      e feedback são registrados separadamente, sem executar chamadas extras ou elevar permissões.
    - Treino e avaliação respeitam tempo, projeto e família; confiança de co-mudança, score de risco e detectores
      de repetição são hipóteses e não comprovam causalidade ou prioridade de negócio.
    - Avaliação off-policy declara a propensão da política realmente executada e seu suporte; distribuição de sugestões
      não simula exploração observada e ações sem suporte não recebem estimativa causal válida.
    - Ativação requer dados e critérios pré-registrados adequados à tarefa, revisão independente, qualidade semântica,
      orçamento e rollback; não adota limiar fixo universal, promove modelo automaticamente ou confunde parada rígida
      com heurística de anomalia.
  - id: ahc-041
    title: Visão de fluxo e dossiê de decisões por projeto
    description: Como PO, quero enxergar etapa atual, bloqueios e decisões pendentes com dono e evidência, reduzindo
      espera humana sem inventar aprovações.
    depends_on:
    - ahc-027
    - ahc-028
    - ahc-032
    - ahc-036
    inputs:
    - SprintSnapshot
    - TraceabilityGraph
    - recibos e decisões
    outputs:
    - DeliveryFlowSnapshot
    - DecisionDossier
    - FlowMetrics
    risk: medium
    implementation: deterministic
    acceptance_criteria:
    - Visão CLI ou documento gerado diferencia etapa proposta, execução observada, check, revisão e aceite, com fonte
      por campo, dono, stale e desconhecido; UI é adapter futuro opcional.
    - Dossiê reúne regra, alternativas, evidências, impacto, reversibilidade, dúvidas e consequências; pareceres de
      modelos e voto majoritário são consultivos e não substituem decisão humana.
    - Métricas separam tempo de agente, espera por revisão, retrabalho e bloqueio usando eventos reais; capacidade,
      prazos e velocity ausentes ficam desconhecidos, sem vigilância de pessoas ou coleta de prompts privados.
    - Nexo e Vera consomem o mesmo snapshot para review e carryover; silêncio, checklist marcado ou merge não equivalem
      a aceite e novos eventos não publicam remotamente sem operação autorizada.
  - id: ahc-042
    title: Pacotes versionados de conhecimento e documentação enxuta
    description: Como compilador, quero selecionar conhecimento por capacidade e versão do projeto alvo sem duplicar
      fontes normativas nem transferir conteúdo privado.
    depends_on:
    - ahc-005
    - ahc-015
    - ahc-020
    - ahc-033
    inputs:
    - CapabilityGraph
    - lockfiles declarados
    - fontes revisadas
    outputs:
    - KnowledgePackSpec
    - KnowledgePackRegistry
    - DocumentationMap
    risk: high
    implementation: deterministic
    acceptance_criteria:
    - Pacotes possuem origem, direitos de uso, versão, compatibilidade, conteúdo por digest, aplicabilidade e limites;
      seleção deriva de capacidades e dependências observadas, sem lista fechada de nichos ou downloads implícitos.
    - Registro separa identidade do conhecimento e permissão de execução; pacote, skill ou prompt não cria autoridade
      e é revalidado para isolamento, versão e política em cada uso.
    - Mapa documental declara fonte normativa única e vistas geradas com check de drift; ADR, DE, DOC e registro de
      entrega se referenciam sem copiar texto integral a cada revisão de evidência.
    - Retenção mantém evidência compacta rastreável e artifacts sensíveis em armazenamento autorizado; expiração impede
      replay declarado como verificado e migração preserva revisões antigas, sem apagar histórico ou republicar material
      restrito.
