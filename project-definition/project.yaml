schema_version: ProjectInput/v1
id: ai-harness-compiler
name: AI Harness Compiler
conception: >-
  Compilar a intenção de novos projetos em harnesses de engenharia de IA específicos,
  tipados, rastreáveis, verificáveis e evolutivos. O produto inclui arquitetura,
  contexto, políticas, skills, prompts, ferramentas e planos de avaliação; agentes
  entram somente quando sua complexidade é justificada por evidências. Para cada
  projeto alvo, compilar também documentação permanente, memória de engenharia,
  captura de incidentes e lições verificadas, além de especialistas de domínio
  com ferramentas, competências, contexto e avaliações próprios.
  O compilador é generalista: estuda proposta, branding e regras de negócio por
  projeto, com packs opcionais extensíveis e sem nichos fixos no core.
domain: developer-tools
branding:
  audience: [AI engineers, tech leads, equipes de produto]
  tone: [técnico, claro, verificável]
  principles: [evidência antes de autonomia, contratos antes de geração, core independente]
  visual_constraints: [priorizar CLI e documentação acessível na primeira fase]
constraints:
  technical: [Python 3.12+, core puro sem SDKs de agentes, IR versionada, Linux e Windows]
  security: [inputs não confiáveis, aprovação para efeitos externos, isolamento entre projetos]
  business: [Apache-2.0, baseline offline, custo de serviços explicitamente autorizado]
  max_build_cost_usd: 0
backlog:
  - id: ahc-001
    title: Intake canônico e limites de entrada
    description: Como AI engineer, quero carregar definições confiáveis e diagnosticar entradas inválidas antes de planejar o harness.
    acceptance_criteria:
      - Chaves YAML duplicadas, manifesto acima do limite configurado e versões desconhecidas falham com diagnóstico estável.
      - UTF-8 e referências locais válidas são aceitas sem executar conteúdo ou acessar a rede.
      - Os casos válidos e inválidos são verificados em Linux e Windows.
    inputs: [project.yaml]
    outputs: [ProjectInput validado, diagnósticos]
    data_owner: proprietário do projeto
    risk: medium
    implementation: deterministic
  - id: ahc-002
    title: Perfil multidimensional de domínio
    description: Como arquiteto, quero distinguir domínio declarado, hipóteses e incógnitas para evitar decisões baseadas em certeza inventada.
    acceptance_criteria:
      - O contrato representa domínio, arquétipo, dados, risco e origem da classificação.
      - Declaração, hipótese e DOMAIN_UNCERTAIN possuem invariantes testadas e não fabricam confiança numérica.
      - A mudança de contrato tem política de compatibilidade e exemplo de migração documentados.
    depends_on: [ahc-001]
    risk: medium
    implementation: deterministic
  - id: ahc-003
    title: Evidence Pack com proveniência
    description: Como revisor, quero rastrear decisões a fontes e conhecer suas limitações de confiança e atualidade.
    acceptance_criteria:
      - Fontes possuem ID, origem, digest opcional, estado de verificação e instante de coleta quando aplicável.
      - Referências ausentes, duplicadas ou incompatíveis com a decisão são rejeitadas.
      - Declaração de usuário e pesquisa externa são distinguíveis sem disparar pesquisa automática.
    depends_on: [ahc-001]
    risk: medium
    implementation: deterministic
  - id: ahc-004
    title: Confiabilidade e benchmark offline do compilador
    description: Como mantenedor, quero demonstrar reprodutibilidade e medir o compilador com fixtures de diferentes domínios.
    acceptance_criteria:
      - Educação, comércio e ferramentas de desenvolvimento possuem fixtures com critérios rastreáveis.
      - Falhas de escrita produzem diagnóstico e não alteram um projeto existente.
      - Um benchmark offline registra duração, tamanho e versão sem declarar SLO sem medição.
    depends_on: [ahc-001]
    risk: medium
    implementation: deterministic
  - id: ahc-005
    title: PromptSpec e SkillSpec compiláveis
    description: Como AI engineer, quero procedimentos e prompts tipados, com ativação, contexto e verificadores explícitos.
    acceptance_criteria:
      - Contratos incluem entradas, saídas, versão, restrições, ferramentas e avaliação.
      - Projetos contrastantes e projetos do mesmo domínio com regras diferentes geram procedimentos ligados aos requisitos, sem ramificações fixas de nicho no core.
      - Referências inválidas falham antes da emissão e skills suportam carregamento progressivo.
    depends_on: [ahc-002, ahc-003, ahc-019, ahc-020]
    risk: medium
    implementation: deterministic
  - id: ahc-006
    title: Context Engine com orçamento e proveniência
    description: Como runtime, quero selecionar contexto relevante dentro de um orçamento e informar exclusões e conflitos.
    acceptance_criteria:
      - Seleção respeita orçamento e registra fontes selecionadas, omitidas e conflitantes.
      - Dados de projetos diferentes não compartilham contexto implicitamente.
      - Fixtures medem relevância e comportamento com fontes desatualizadas.
    depends_on: [ahc-003, ahc-005]
    risk: high
    implementation: undecided
  - id: ahc-007
    title: Tools e Policy Engine independente
    description: Como operador, quero validar permissões, budgets e aprovações antes de efeitos colaterais.
    acceptance_criteria:
      - ToolSpec define escopo, I/O, efeitos, idempotência e limites de execução.
      - Escritas externas sem aprovação falham antes da chamada e geram evento auditável.
      - Negação por política é testada sem depender de decisão de modelo.
    depends_on: [ahc-005]
    risk: high
    implementation: deterministic
  - id: ahc-008
    title: Eval runner e Simulation Lab
    description: Como revisor, quero executar tarefas isoladas e avaliar resultado, trajetória e regressões.
    acceptance_criteria:
      - Evals distinguem not-run, pass, fail e error com evidências persistidas.
      - Sandbox e timeout limitam execução; falhas não são interpretadas como aprovação.
      - Gates verificam saída e uso de ferramentas com datasets de teste reservados.
    depends_on: [ahc-004, ahc-005]
    risk: high
    implementation: deterministic
  - id: ahc-009
    title: Adapter de LLM e pesquisa controlada
    description: Como projetista, quero usar provedores substituíveis para hipóteses e pesquisa com limites e proveniência.
    acceptance_criteria:
      - Adapter possui fake offline e contrato testado de timeout, retry e orçamento.
      - Saídas do modelo são validadas por schema e política antes de qualquer ação.
      - Pesquisa preserva citações e separa fontes verificadas de declarações não verificadas.
    depends_on: [ahc-003, ahc-007]
    risk: high
    implementation: llm
  - id: ahc-010
    title: Execução durável e observabilidade
    description: Como operador, quero retomar jobs e aprovações após falhas sem duplicar efeitos.
    acceptance_criteria:
      - Workflow retoma após interrupção com idempotência e limites de tentativas.
      - Spans e métricas correlacionam projeto, build, versão e etapa sem segredos.
      - Cancelamento e expiração de aprovação são exercitados em testes de integração.
    depends_on: [ahc-008, ahc-009]
    risk: high
    implementation: deterministic
  - id: ahc-011
    title: Busca e comparação de arquiteturas
    description: Como arquiteto, quero comparar candidatos sob qualidade, custo, latência e complexidade.
    acceptance_criteria:
      - Candidatos executam o mesmo benchmark e incluem baseline sem agentes.
      - Busca possui orçamento e condição de parada aplicados pelo control plane.
      - Ranking registra evidências e trade-offs e não usa o conjunto de teste para otimização.
    depends_on: [ahc-006, ahc-010]
    risk: high
    implementation: undecided
  - id: ahc-012
    title: Instalação revisável e rollback
    description: Como mantenedor de um projeto, quero adotar um harness após revisar diff e restaurar a versão anterior.
    acceptance_criteria:
      - Dry-run informa arquivos novos, alterados e conflitos sem escrever no alvo.
      - Instalação exige gates de avaliação e aprovação e detecta alterações concorrentes.
      - Falha parcial tem recuperação testada e rollback preserva conteúdo do usuário.
    depends_on: [ahc-004, ahc-008]
    risk: high
    implementation: deterministic
  - id: ahc-013
    title: Evolução e Experience Store
    description: Como equipe, quero propor melhorias a partir de falhas sem permitir autoalteração irrestrita.
    acceptance_criteria:
      - Proposta liga falha, evidência, versão anterior e mudança candidata.
      - Regressão e aprovação bloqueiam promoção insegura.
      - Experiências e skills reutilizadas têm versão, proveniência e isolamento entre projetos.
    depends_on: [ahc-010, ahc-011, ahc-012, ahc-018]
    risk: high
    implementation: undecided
  - id: ahc-014
    title: API e operação multi-projeto
    description: Como organização, quero processar múltiplos projetos com limites, isolamento e acompanhamento de jobs.
    acceptance_criteria:
      - API autentica chamadas, aplica autorização por projeto e idempotência por solicitação.
      - Jobs possuem quotas, backpressure, paginação e consulta de estado.
      - Teste de carga mede throughput e latência e teste de isolamento impede acesso cruzado.
    depends_on: [ahc-010, ahc-012]
    risk: high
    implementation: deterministic
  - id: ahc-015
    title: DocumentationLearningSpec por projeto
    description: Como PO de um projeto alvo, quero especificar sua documentação e memória de aprendizado conforme domínio, requisitos e restrições.
    acceptance_criteria:
      - A IR versionada define taxonomia DE/DOC/ADR/INC/LES/RUN/EXP, ownership, revisão, retenção, proveniência e escopo do projeto.
      - Contexto e política de aprendizado derivam de ProjectDNA e Evidence Pack, com incógnitas explícitas e rastreabilidade de cada regra.
      - Projetos com regras distintas, incluindo domínio não pré-cadastrado, demonstram configurações diferentes sem copiar memória privada entre projetos.
    depends_on: [ahc-003, ahc-005]
    inputs: [ProjectDNA, Evidence Pack, requisitos de documentação e aprendizado]
    outputs: [DocumentationLearningSpec validada]
    data_owner: proprietário do projeto alvo
    risk: high
    implementation: deterministic
  - id: ahc-016
    title: Compilador de documentação e memória específicas
    description: Como equipe de um projeto alvo, quero receber um sistema funcional de registros, busca e aprendizado integrado ao harness gerado.
    acceptance_criteria:
      - O build gera contratos, registros iniciais rastreáveis, templates de domínio, índice, CLI/adapters, políticas e instruções para colaboradores e agentes.
      - A biblioteca gerada preserva revisões, isolamento, validade das evidências e conflitos de atualização; exemplos fictícios não são promovidos a soluções verificadas.
      - Dois projetos recebem bundles distintos e reprodutíveis, com testes da memória e atribuições de componentes incorporados.
    depends_on: [ahc-004, ahc-015]
    inputs: [DocumentationLearningSpec, HarnessSpec]
    outputs: [sistema de documentação e memória compilado para o projeto]
    data_owner: proprietário do projeto alvo
    risk: high
    implementation: deterministic
  - id: ahc-017
    title: Agent Factory com especialização de domínio
    description: Como PO de um projeto alvo, quero especialistas aprofundados que conheçam o domínio, usem ferramentas adequadas e respondam a critérios mensuráveis.
    acceptance_criteria:
      - AgentSpec representa persona, competências, objetivo, fronteiras, I/O, skills, tools/MCP, memória, modelo, orçamento, parada, delegação e responsável humano.
      - O runtime compilado executa ferramentas específicas em tarefas do domínio e consulta a memória vigente; prompts genéricos com nomes novos não satisfazem a especialização.
      - Fixtures comparam especialistas a uma baseline nas mesmas tarefas e medem resultado, trajetória, uso de ferramentas, custo e latência com datasets reservados.
      - O projeto pode receber zero agentes quando código ou workflows atendem aos critérios; adaptações LangGraph/LLM/ML ficam atrás de contratos próprios.
    depends_on: [ahc-005, ahc-007, ahc-009, ahc-015]
    inputs: [ProjectDNA, CapabilityGraph, Evidence Pack, DocumentationLearningSpec]
    outputs: [AgentSpec e runtime de especialistas específicos do projeto]
    data_owner: proprietário do projeto alvo
    risk: high
    implementation: undecided
  - id: ahc-018
    title: Pipeline de aprendizagem por experiências do projeto
    description: Como equipe de um projeto alvo, quero registrar desafios e reutilizar soluções verificadas entre sessões de chat e execuções de agentes.
    acceptance_criteria:
      - Falha relevante pode produzir INC draft com reprodução e origem; diagnóstico, tentativas e solução permanecem separados de hipóteses não verificadas.
      - Regressão, evidência, aplicabilidade, limitações e revisão são exigidas para promover LES e recuperar a solução em tarefas futuras.
      - Colaboradores via chat e agentes locais/providers compartilham o protocolo, com orçamento de contexto, detecção de evidência alterada e trilha de revisão.
      - Transferência de experiências entre projetos exige autorização, anonimização, compatibilidade e revisão; treinamento de modelos ocorre apenas em EXP separado e avaliado.
    depends_on: [ahc-008, ahc-010, ahc-016, ahc-017]
    inputs: [traces, falhas, desafios, correções propostas, evidências de regressão]
    outputs: [incidentes, lições verificadas, procedimentos e propostas de evolução]
    data_owner: proprietário do projeto alvo
    risk: high
    implementation: undecided
  - id: ahc-019
    title: Entendimento generalista da proposta e regras de negócio
    description: Como PO, quero que o compilador estude proposta, branding, backlog e restrições para propor entendimento do projeto sem exigir um nicho pré-programado.
    acceptance_criteria:
      - ProjectUnderstandingSpec preserva input original, fontes, declarações, hipóteses de domínio, público, objetivos, entidades, regras de negócio, conflitos e perguntas pendentes com referências válidas.
      - Um adapter de modelo substituível produz propostas estruturadas; fake é restrito a testes, respostas reais são validadas e uma execução controlada com modelo real é demonstrada sem promover hipóteses ou scores inventados a fatos.
      - Avaliação reservada cobre domínio não cadastrado, mesmo domínio com regras diferentes, branding em conflito com backlog e proposta ambígua; nenhum enum ou switch de nichos é necessário para processar input novo.
    depends_on: [ahc-002, ahc-003]
    inputs: [proposta, branding, backlog, restrições, fontes locais autorizadas]
    outputs: [ProjectUnderstandingSpec proposta, regras de negócio rastreáveis, perguntas pendentes]
    data_owner: proprietário do projeto alvo
    risk: high
    implementation: llm
  - id: ahc-020
    title: Plano de harness generalista e packs opcionais
    description: Como AI engineer, quero derivar o plano do harness do entendimento e selecionar frameworks/templates extensíveis quando aplicáveis, sem depender de uma lista fixa de nichos.
    acceptance_criteria:
      - HarnessBlueprintSpec mapeia regras e capacidades a necessidades de contexto, skills, ferramentas, workflows, documentação e evals, e alimenta a compilação da baseline atual após revisão; módulos ainda não implementados permanecem gaps explícitos.
      - PatternPackSpec versionado define aplicabilidade, evidências, parâmetros, exclusões, conflitos e compatibilidade; o projeto funciona sem pack e novos packs são registrados sem editar o core, com regras específicas do projeto prevalecendo.
      - O mesmo domínio com regras diferentes gera planos diferentes; domínio novo sem pack tem baseline válida ou perguntas pendentes, e seleção incompatível, revisão inválida ou regras sem origem são rejeitadas antes de exportar a proposta.
    depends_on: [ahc-019]
    inputs: [ProjectUnderstandingSpec, CapabilityGraph, Evidence Pack, catálogo opcional de packs]
    outputs: [HarnessBlueprintSpec revisável, decisões de seleção de packs e gaps]
    data_owner: proprietário do projeto alvo
    risk: high
    implementation: undecided
  - id: ahc-021
    title: Rubrica e evals semânticos do entendimento
    description: Como PO, quero medir cobertura de regras, suporte das citações e qualidade de conflitos para impedir que JSON válido seja confundido com entendimento correto.
    acceptance_criteria:
      - Dataset versionado separa desenvolvimento e holdout com inputs e expectativas congelados antes da otimização; inclui domínio novo, regras divergentes na mesma categoria, ambiguidade, contradição real, regras compatíveis, asset não lido e conteúdo adversarial.
      - Runner específico de entendimento registra not-run, pass, fail e error, modelo/digest, input/prompt/rubrica, tentativas e evidências; revisão semântica pendente ou campos ausentes nunca são interpretados como aprovação.
      - Verificadores e revisão humana avaliam cobertura de regras, suporte de cada citação, conflitos falsos e dados não lidos; o modelo candidato não aprova sua própria saída, e chamadas reais permanecem fora dos testes padrão.
    depends_on: [ahc-002, ahc-003, ahc-004]
    inputs: [ProjectUnderstandingSpec, corpus de desenvolvimento, holdout, rubrica]
    outputs: [relatórios semânticos rastreáveis, falhas de cobertura e suporte]
    data_owner: proprietário do projeto e PO
    risk: high
    implementation: deterministic
  - id: ahc-022
    title: Pipeline de entendimento com grounding e cobertura
    description: Como AI engineer, quero que o estudo extraia regras completas e conclusões sustentadas pelas fontes, preservando incógnitas e bloqueando inventar conteúdo de assets.
    acceptance_criteria:
      - Extração tipada e análise separam declarações, hipóteses, regras, perguntas e conflitos; não inferem que revisão humana exige revisor externo nem afirmam conteúdo de asset não ingerido.
      - Prompts e estratégia de decomposição são versionados e ajustados somente no conjunto de desenvolvimento; validação de suporte, cobertura e revisão impede promoção silenciosa de hipóteses.
      - Baseline e candidato são comparados com a rubrica congelada; regressões do INC-0007 são reproduzidas, tentativas limitadas são registradas e falhas permanecem explícitas sem reparo ilimitado ou aprovação automática.
    depends_on: [ahc-021]
    inputs: [UnderstandingRequest, fontes autorizadas, rubrica e findings]
    outputs: [propostas fundamentadas, prompts versionados, regressões semânticas]
    data_owner: proprietário do projeto alvo
    risk: high
    implementation: llm
  - id: ahc-023
    title: Qualificação do modelo e perfil de execução local
    description: Como operador, quero escolher modelo e perfil pelo equilíbrio entre qualidade, latência e memória no hardware disponível, com alimentação e ambiente registrados.
    acceptance_criteria:
      - Comparação registra modelo/digest, quantização, contexto, prompt, parâmetros, energia, ambiente, uso de GPU/RAM e tempos de carga e geração; cold e warm são separados e o plano prevê repetições e limites de execução.
      - Modelo é selecionado pela rubrica semântica antes de latência; holdout não é usado para tuning, e falha crítica, julgamento pendente, truncamento ou omissão de regras obrigatórias bloqueiam qualificação.
      - Perfil recomendado possui comandos reproduzíveis, orçamento e fallback explícitos; nenhum vencedor é obrigatório quando todos falham, e nova configuração não altera energia do sistema nem habilita cloud ou concorrência sem autorização.
    depends_on: [ahc-022]
    inputs: [candidatos locais, rubrica, holdout, telemetria e resultados]
    outputs: [relatório de qualificação, perfil recomendado ou rejeição justificada]
    data_owner: proprietário do ambiente
    risk: high
    implementation: deterministic
